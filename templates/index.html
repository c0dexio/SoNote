<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoNote</title><link rel="stylesheet" href="/static/css/style.css?v=4"></head>
<body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><span class="brandmark">s</span><span>sonote</span><button class="iconbtn collapse" id="collapse" title="Réduire">‹</button></div>
<div class="searchbox"><span>⌕</span><input id="search" placeholder="Rechercher" autocomplete="off"><kbd>⌘ K</kbd></div><div id="results" class="results hidden"></div>
<div class="side-actions"><button id="newPage"><span>＋</span> Nouvelle page</button><button id="newFolder"><span>▱</span> Nouveau dossier</button></div>
<div class="nav-label">ESPACE DE TRAVAIL</div><nav id="tree"></nav><div class="nav-label fav-label">FAVORIS</div><nav id="favorites"></nav>
<div class="side-bottom"><button id="trashBtn">♲ <span>Corbeille</span></button><button id="themeBtn">◐ <span>Apparence</span></button><div class="profile"><div class="avatar" id="avatar">M</div><div class="profile-meta"><button class="workspace-name" id="workspaceName">Mon espace Note<span aria-hidden="true">✎</span></button><small>Local · privé</small></div><span class="offline"></span></div></div></aside>
<main class="main"><header class="topbar"><div class="crumb"><span id="crumbIcon">📝</span><span id="crumbTitle">Bienvenue</span><span class="slash">/</span><span class="saved" id="saveState">● Enregistré</span></div><div class="top-actions"><button class="iconbtn" id="favorite" title="Ajouter aux favoris">☆</button><button class="export" id="export">↧ Exporter</button><button class="more" id="more">···</button><div id="moreMenu" class="menu hidden"><button id="deletePage">Mettre à la corbeille</button></div></div></header>
<section class="paper"><div class="page-head"><button id="pageEmoji" class="page-emoji">👋</button><input id="title" class="title" value="Bienvenue dans SoNote" placeholder="Sans titre" maxlength="120"><div class="meta">Modifié à l’instant <span>·</span> Privé</div></div><div class="editor-toolbar"><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="strikeThrough"><s>S</s></button><i></i><button data-cmd="formatBlock" data-value="h2">H₂</button><button data-cmd="insertUnorderedList">☷</button><button data-cmd="formatBlock" data-value="blockquote">❝</button><button data-cmd="formatBlock" data-value="pre">{ }</button><button data-cmd="createLink" title="Lien">↗</button><span class="toolbar-label">Mise en forme</span></div><div id="blocks" class="blocks"></div><button id="addBlock" class="add-block">＋ <span>Ajouter un bloc</span></button><div class="hint">Astuce : tapez <kbd>/</kbd> pour changer le type de bloc</div></section></main></div>
<div id="toast" class="toast"></div><dialog id="trashDialog"><div class="dialog-head"><h2>Corbeille</h2><button class="iconbtn" id="closeTrash">×</button></div><div id="trashContent"></div></dialog><dialog id="moveDialog"><div class="dialog-head"><h2>Ranger la note</h2><button class="iconbtn" id="closeMove">×</button></div><p class="dialog-copy">Choisissez le dossier où déplacer cette note.</p><select id="folderSelect" class="folder-select"></select><div class="dialog-actions"><button id="cancelMove" class="secondary">Annuler</button><button id="confirmMove" class="primary">Déplacer</button></div></dialog>
<div id="slashMenu" class="slash-menu hidden"></div><script src="/static/js/app.js?v=4"></script></body></html>
